[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
solc_version = "0.8.25"
fs_permissions = [{ access = "read", path = "./test/" }]
gas_limit = 72057594037927935  # 2^56 - 1 (JavaScript-friendly)
# ffi lets tests run arbitrary host commands; no test needs it. Use FOUNDRY_PROFILE=ffi for
# test/ZKNOX_PythonSigner.sol, which signs through the Python reference implementation.
ffi = false

[profile.lite]
optimizer = false
evm_version = "cancun"
solc_version = "0.8.25"
via_ir = true
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
solc_version = "0.8.25"
fs_permissions = [{ access = "read", path = "./test/" }]
gas_limit = 72057594037927935
ffi = false

[profile.ffi]
# opt-in profile for tests that call vm.ffi (e.g. test/ZKNOX_PythonSigner.sol); inherits [profile.default]
ffi = true
